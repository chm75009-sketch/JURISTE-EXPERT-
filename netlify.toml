# ============================================================================
# Configuration Netlify — Juris Expert MCH
# Site 100 % statique (HTML/CSS/JS) + Supabase en back-end : AUCUN build.
# Netlify publie simplement les fichiers du dépôt.
# (Même modèle de sécurité que nomos-haccp.fr — en-têtes impossibles sur GitHub Pages.)
# ============================================================================

[build]
  publish = "."
  # Pas de commande de build : on sert les fichiers tels quels.
  command = ""

# ── En-têtes de sécurité (appliqués à toutes les pages) ─────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Anti-clickjacking : l'app ne peut pas être affichée dans un <iframe> d'un autre site.
    X-Frame-Options = "SAMEORIGIN"
    # Empêche le navigateur de "deviner" le type des fichiers (anti-injection).
    X-Content-Type-Options = "nosniff"
    # Ne fuite pas l'URL complète vers les sites externes.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS pendant 1 an (le navigateur refusera le HTTP ensuite).
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Réduit les permissions du navigateur non utilisées par l'app.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    # CSP ACTIVE (mode appliqué) : bloque tout script/ressource non autorisé (anti-XSS).
    # Liste blanche auditée pour Juris Expert :
    #   - script : uniquement 'self' + inline (aucun script CDN externe)
    #   - style/police : Google Fonts
    #   - connexions : Supabase (REST+auth), Forminit & Web3Forms (formulaires),
    #                  France Travail (offres) + proxy Cloudflare Worker
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://yhzsuxnehsisxkuxqhhg.supabase.co wss://yhzsuxnehsisxkuxqhhg.supabase.co https://forminit.com https://api.web3forms.com https://api.francetravail.io https://*.workers.dev; worker-src 'self' blob:; frame-src 'self' blob: data:; form-action 'self' https://forminit.com https://api.web3forms.com; object-src 'none'; base-uri 'self'"
